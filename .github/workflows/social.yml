# Posts queued drafts from data/social.json to X and Bluesky.
# The research agent writes drafts; only this workflow holds the credentials (repository secrets).
name: Social posts

on:
  push:
    branches: [main]
    paths: ['data/social.json']
  schedule:
    # Hourly, 11:17–23:17 UTC (7am–7pm US Eastern). Each run posts at most the next queued draft (max_per_run),
    # and only if the last post was min_gap_minutes ago, so posts land about every 2 hours. Hourly because
    # GitHub drops some scheduled runs: a missed run is caught up an hour later. Also retries platform rejections.
    - cron: '17 11-23 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = test logins only; dry-run = show what would be posted; post = post queued drafts'
        type: choice
        options: [check, dry-run, post]
        default: check

permissions:
  contents: write

concurrency:
  group: social-posts
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate data and drafts
        run: node scripts/validate.mjs

      - name: Build site (for chart images)
        run: node scripts/build.mjs

      - name: Serve built site locally
        run: |
          python3 -m http.server 8765 -d dist >/dev/null 2>&1 &
          sleep 1

      - name: Post
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          CHECK: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'check') && '1' || '' }}
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run') && '1' || '' }}
          LOCAL_SITE: http://localhost:8765
        run: node scripts/social_post.mjs

      - name: Save post log
        if: always()   # keep the log even when a post gave up (that run is marked failed so GitHub emails)
        run: |
          if [ -n "$(git status --porcelain data/social-log.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/social-log.json
            git commit -m "social: update post log [skip ci]"
            git pull --rebase --quiet origin main
            git push origin HEAD:main
          fi
