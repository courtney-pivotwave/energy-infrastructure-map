<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Embed demo</title>
<!-- Used only by the embedding video (scenes/embedding.mjs). A deliberately generic host page at a reserved
     .example domain, with placeholder bars instead of text, so it can't be mistaken for a real publication. -->
<style>
  :root { --ink: #1a2332; --ink-3: #8a94a6; --bar: #e3e1db; --accent: #1a6bb5; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #dcd9d1; color: var(--ink); height: 100vh; overflow: hidden;
    display: flex; align-items: center; justify-content: center; }
  .window { width: 1280px; height: 770px; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 18px 60px rgba(0,0,0,.18); display: flex; flex-direction: column; }
  .chrome { height: 46px; background: #f1efea; border-bottom: 1px solid #e2dfd8; display: flex; align-items: center; gap: 16px; padding: 0 16px; flex-shrink: 0; }
  .dots { display: flex; gap: 7px; } .dots i { width: 12px; height: 12px; border-radius: 50%; background: #d3d0c8; display: block; }
  .url { flex: 1; max-width: 560px; margin: 0 auto; height: 28px; border-radius: 8px; background: #fff; border: 1px solid #e2dfd8; display: flex; align-items: center;
    padding: 0 12px; font-size: 13.5px; color: #4a5568; }
  .url b { color: var(--ink); font-weight: 600; }
  .site { height: 54px; border-bottom: 1px solid #ecebe6; display: flex; align-items: center; gap: 28px; padding: 0 48px; flex-shrink: 0; }
  .logo { font-weight: 800; font-size: 18px; letter-spacing: -.01em; }
  .nav { display: flex; gap: 18px; } .nav i { width: 64px; height: 9px; border-radius: 5px; background: var(--bar); display: block; }
  main { padding: 22px 48px 0; display: grid; grid-template-columns: 1fr 250px; gap: 40px; min-height: 0; }
  .kicker { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #c75000; }
  h1 { font-size: 30px; line-height: 1.15; letter-spacing: -.015em; margin: 8px 0 12px; }
  .bars i { display: block; height: 10px; border-radius: 5px; background: var(--bar); margin: 0 0 9px; }
  .embed { margin-top: 14px; border-radius: 8px; overflow: hidden; border: 1px solid #e6e4de; }
  iframe { display: block; width: 100%; height: 448px; border: 0; }
  .credit { font-size: 12px; color: var(--ink-3); margin-top: 6px; }
  aside { padding-top: 26px; } aside .card { border-radius: 8px; background: #f6f5f1; height: 150px; margin-bottom: 18px; }
</style>
</head>
<body>
  <div class="window">
    <div class="chrome"><div class="dots"><i></i><i></i><i></i></div><div class="url"><b>yoursite.example</b>/energy/chokepoints-explainer</div></div>
    <div class="site"><div class="logo">Your Site</div><div class="nav"><i></i><i></i><i></i><i></i></div></div>
    <main>
      <article>
        <div class="kicker">Explainer</div>
        <h1>Your article about energy, with the live map built in</h1>
        <div class="bars"><i style="width:96%"></i><i style="width:88%"></i></div>
        <div class="embed"><iframe src="/?embed=1&amp;region=mideast&amp;notrack=1" title="Strategic Energy Infrastructure Map" loading="eager"></iframe></div>
        <div class="credit">Live map: Strategic Energy Infrastructure Map</div>
      </article>
      <aside><div class="card"></div><div class="bars"><i style="width:90%"></i><i style="width:70%"></i><i style="width:82%"></i></div><div class="card" style="margin-top:18px"></div></aside>
    </main>
  </div>
</body>
</html>
