<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strategic Energy Infrastructure Map</title>
<meta name="description" content="Live map of global oil and gas infrastructure, chokepoints, and conflict disruptions — with scenario planning.">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="stylesheet" href="styles.css?v=3" />
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brand-title">Strategic Energy Infrastructure</div>
    <div class="brand-sub" id="freshness">Loading data…</div>
  </div>
  <div class="ticker" id="ticker" aria-label="Energy benchmark prices"></div>
  <nav class="regions" id="regions" aria-label="Jump to region">
    <button data-region="world">World</button>
    <button data-region="americas">Americas</button>
    <button data-region="europe">Europe</button>
    <button data-region="mideast">Middle East</button>
    <button data-region="asia">Asia</button>
  </nav>
</header>

<aside class="panel left" id="leftPanel">
  <button class="panel-toggle" id="leftToggle" aria-expanded="true">Layers</button>
  <div class="panel-body">
    <h4>Layers</h4>
    <div id="layerList"></div>
    <h4 class="mt">Operating status</h4>
    <div class="status-legend" id="statusLegend"></div>
  </div>
</aside>

<aside class="panel right" id="rightPanel">
  <div class="tabs" role="tablist">
    <button role="tab" data-tab="latest" class="active">Latest</button>
    <button role="tab" data-tab="chokepoints">Chokepoints</button>
    <button role="tab" data-tab="fuel">Pump prices</button>
    <button role="tab" data-tab="scenario">What-if</button>
  </div>
  <div class="tab-body" id="tab-latest"></div>
  <div class="tab-body hidden" id="tab-chokepoints"></div>
  <div class="tab-body hidden" id="tab-fuel"></div>
  <div class="tab-body hidden" id="tab-scenario"></div>
  <div class="tab-body hidden" id="tab-detail"></div>
</aside>

<div class="scenario-bar hidden" id="scenarioBar"></div>

<div id="map"></div>

<script src="app.js?v=3"></script>
</body>
</html>
